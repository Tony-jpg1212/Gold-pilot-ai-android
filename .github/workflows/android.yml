
name: Build GoldPilot AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldPilotAI_Phone_Build_Package.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract GoldPilot AI
        run: |
          unzip -o GoldPilotAI_Phone_Build_Package.zip -d source

      - name: Build APK
        run: |
          cd source/GoldPilotAI_Signals/android
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldPilotAI-APK
          path: source/GoldPilotAI_Signals/android/app/build/outputs/apk/debug/app-debug.apk
          
